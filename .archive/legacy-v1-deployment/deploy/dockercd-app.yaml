# Default self-monitoring manifest (standalone mode, GitHub source, manual sync).
# For bundle mode (Gitea source, automated sync) use: dockercd-app.bundle.yaml
# install.sh selects the correct manifest automatically based on --mode.
apiVersion: dockercd/v1
kind: Application
metadata:
  name: dockercd
spec:
  source:
    repoURL: https://github.com/mkolb22/dockercd.git
    targetRevision: main
    path: deploy/
    composeFiles:
      - docker-compose.yml
  destination:
    dockerHost: unix:///var/run/docker.sock
    projectName: dockercd
  syncPolicy:
    automated: false
    prune: false
    selfHeal: false
    pollInterval: 300s
