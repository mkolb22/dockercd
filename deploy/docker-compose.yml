services:
  dockercd:
    image: dockercd:latest
    pull_policy: never
    container_name: dockercd
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - dockercd-state:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKERCD_DATA_DIR: /data
      DOCKERCD_CONFIG_DIR: /config/applications
      DOCKERCD_LOG_LEVEL: info
      DOCKERCD_API_HOST: "0.0.0.0"
      DOCKERCD_API_PORT: "8080"
      # Set this to a random value of at least 32 characters before deployment.
      DOCKERCD_API_TOKEN: ${DOCKERCD_API_TOKEN:-}
      # Development-only escape hatch. Keep false for normal deployments.
      DOCKERCD_ALLOW_INSECURE_NO_AUTH: ${DOCKERCD_ALLOW_INSECURE_NO_AUTH:-false}
      DOCKERCD_GIT_TOKEN: ${DOCKERCD_GIT_TOKEN:-}
      DOCKERCD_GIT_ALLOWED_HOSTS: ${DOCKERCD_GIT_ALLOWED_HOSTS:-github.com}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - dockercd-net

volumes:
  dockercd-state:

networks:
  dockercd-net:
    external: true
